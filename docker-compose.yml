version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: pep-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./pep.db
      - SECRET_KEY=change-this-secret-key-in-production
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - ./pep.db:/app/pep.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    container_name: pep-frontend
    ports:
      - "8501:8501"
    depends_on:
      - backend
    environment:
      - API_BASE_URL=http://backend:8000/api/v1
    restart: unless-stopped

  # PostgreSQL (optional - for production)
  # db:
  #   image: postgres:15
  #   container_name: pep-db
  #   environment:
  #     - POSTGRES_USER=pep
  #     - POSTGRES_PASSWORD=pep_secret
  #     - POSTGRES_DB=pep
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   restart: unless-stopped

volumes:
  postgres_data:

